apiVersion: v1
kind: Secret
metadata:
  name: arogya-secrets
  namespace: clinical-security
  labels:
    app.kubernetes.io/name: arogyaraksha
    app.kubernetes.io/part-of: arogyaraksha-cns
type: Opaque
stringData:
  # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
  SECRET_KEY: "CHANGE_ME_TO_A_CRYPTOGRAPHICALLY_SECURE_64_CHAR_HEX_STRING"
  # Master AES-256 Key (Must be exactly 64 hex characters / 32 bytes)
  MASTER_ENCRYPTION_KEY: "CHANGE_ME_TO_A_32_BYTE_HEX_ENCODED_AES_256_MASTER_KEY"
  # Production PostgreSQL Connection URI
  DATABASE_URL: "postgresql+psycopg://arogya_prod_user:SECURE_DB_PASSWORD@arogya-postgres.clinical-security.svc.cluster.local:5432/arogya_clinical_db"
  # Initial administrator password consumed by `flask bootstrap-admin` (never a default)
  BOOTSTRAP_ADMIN_PASSWORD: "CHANGE_ME_TO_A_STRONG_UNIQUE_PASSWORD"
  # SMTP relay for password reset delivery
  SMTP_HOST: "smtp.hospital.internal"
  SMTP_USERNAME: "arogya-mailer"
  SMTP_PASSWORD: "CHANGE_ME"
