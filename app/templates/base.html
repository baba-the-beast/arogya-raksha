<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ArogyaRaksha{% endblock %} · ArogyaRaksha</title>
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#073b3d">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <script nonce="{{ csp_nonce() }}" src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
  {% block body %}{% endblock %}
  <script nonce="{{ csp_nonce() }}" src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
