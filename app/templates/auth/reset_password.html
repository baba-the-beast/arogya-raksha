{% extends "layouts/auth.html" %}
{% block title %}Set new password{% endblock %}

{% block card %}
<div class="auth-heading">
  <h1 class="t-page">Set New Password</h1>
  <p>Choose a strong password. You'll be signed out on all devices.</p>
</div>
<form action="{{ url_for('auth.reset_password', token=token) if token else url_for('auth.reset_password_clean') }}" method="POST" class="form-stack" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label class="field-label" for="password">New password</label>
    <div class="input-group no-icon">
      <input class="input has-action" id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required autofocus>
      <button type="button" class="btn btn-ghost btn-sm input-action" data-reveal-target="password" aria-pressed="false">Show</button>
    </div>
    <p class="field-help">At least 8 characters, with upper and lower case letters and a digit.</p>
  </div>
  <button type="submit" class="btn btn-primary btn-block">Update password</button>
</form>
{% endblock %}
